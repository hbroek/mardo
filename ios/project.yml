# The iPhone and iPad app. `make ios-framework ios-web` first (they make the Go core and the page it shows), then
# `cd ios && xcodegen generate` and open Mardo.xcodeproj; xcodegen turns this file into the project.
name: Mardo
options:
  bundleIdPrefix: com.henryvandenbroek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.14.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mardo:
    type: application
    platform: iOS
    sources:
      - path: Mardo
      - path: ../frontend/dist-ios
        type: folder   # the page, copied into the app as a folder the scheme handler serves from
    dependencies:
      - framework: ../build/Mardo.xcframework
        embed: false   # gomobile builds it as a static library in a framework wrapper
    entitlements:
      path: Mardo/Mardo.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.henryvandenbroek.mardo"]   # the Keychain refuses writes (-34018) without it
    info:
      path: Mardo/Info.plist
      properties:
        CFBundleDisplayName: Mardo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true            # saved pages are in the Files app, under Mardo
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false  # only the standard HTTPS the system provides, so no export paperwork per build
        LSApplicationCategoryType: public.app-category.productivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.henryvandenbroek.mardo
        PRODUCT_MODULE_NAME: MardoApp   # the Go framework is the module called Mardo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # ios/Mardo/Assets.xcassets, made from build/appicon.png
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
