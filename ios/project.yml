# The iPhone app. `make ios-framework ios-web` first (they make the Go core and the page it shows), then
# `cd ios && xcodegen generate` and open Mardo.xcodeproj; xcodegen turns this file into the project.
name: Mardo
options:
  bundleIdPrefix: com.hbroek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Mardo:
    type: application
    platform: iOS
    sources:
      - path: Mardo
      - path: ../frontend/dist-ios
        type: folder   # the page, copied into the app as a folder the scheme handler serves from
    dependencies:
      - framework: ../build/Mardo.xcframework
        embed: false   # gomobile builds it as a static library in a framework wrapper
    info:
      path: Mardo/Info.plist
      properties:
        CFBundleDisplayName: Mardo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true            # saved pages are in the Files app, under Mardo
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hbroek.mardo
        PRODUCT_MODULE_NAME: MardoApp   # the Go framework is the module called Mardo
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
