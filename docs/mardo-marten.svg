<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Mardo the Marten, the Mardo mascot, waving and holding a page with the M-down mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d5cf0"/><stop offset=".5" stop-color="#b43ad8"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <clipPath id="tile"><rect x="20" y="20" width="360" height="360" rx="80"/></clipPath>
  </defs>
  <rect x="20" y="20" width="360" height="360" rx="80" fill="url(#bg)"/>
  <g clip-path="url(#tile)" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail: bushy, sweeping up on the right and curling in at the dark tip like the arrow of the mark -->
    <path d="M246 372 C352 376 396 292 360 208 C352 190 330 192 334 210 C352 266 322 318 246 326 Z" fill="#9a5a2e"/>
    <path d="M360 208 C352 190 330 192 334 210 C337 224 340 232 344 242 C354 236 364 224 360 208 Z" fill="#4a2c1a"/>
    <!-- body: slim, with the marten's yellow chest patch -->
    <path d="M140 400 C128 330 150 270 200 262 C250 270 272 330 260 400 Z" fill="#9a5a2e"/>
    <path d="M200 272 C176 282 166 312 178 336 C188 352 212 352 222 336 C234 312 224 282 200 272 Z" fill="#ffd98a"/>
    <!-- waving arm, dark like a marten's legs -->
    <path d="M140 300 C112 290 96 262 90 232" fill="none" stroke="#4a2c1a" stroke-width="26"/>
    <circle cx="89" cy="226" r="17" fill="#4a2c1a"/>
    <g><ellipse cx="89" cy="230.8" rx="8.2" ry="6.5" fill="#7a4a36"/><circle cx="81.9" cy="218.2" r="3.6" fill="#7a4a36"/><circle cx="85.6" cy="216.0" r="3.6" fill="#7a4a36"/><circle cx="89.6" cy="215.5" r="3.6" fill="#7a4a36"/><circle cx="93.6" cy="216.5" r="3.6" fill="#7a4a36"/><g fill="none" stroke-linecap="round"><path d="M78.3 214.1L76.2 211.7 M83.8 210.9L82.7 207.8 M89.8 210.0L90.0 206.8 M96.0 211.6L97.4 208.7" stroke="#8a6a3d" stroke-width="3.1"/><path d="M78.3 214.1L76.2 211.7 M83.8 210.9L82.7 207.8 M89.8 210.0L90.0 206.8 M96.0 211.6L97.4 208.7" stroke="#dcc08c" stroke-width="1.9"/></g></g>
    <!-- ears: rounded triangles, a little pointed, set at the corners of the head -->
    <path transform="translate(150 152) scale(.85) translate(-150 -152)" d="M112 158 C106 130 118 104 140 96 C162 94 180 118 186 142 Z" fill="#9a5a2e" stroke="#9a5a2e" stroke-width="7" stroke-linejoin="round"/>
    <path transform="translate(150 152) scale(.85) translate(-150 -152)" d="M125 150 C122 132 130 116 142 111 C154 111 166 126 172 140 Z" fill="#ffe9bf" stroke="#ffe9bf" stroke-width="6" stroke-linejoin="round"/>
    <path transform="translate(250 152) scale(.85) translate(-250 -152)" d="M288 158 C294 130 282 104 260 96 C238 94 220 118 214 142 Z" fill="#9a5a2e" stroke="#9a5a2e" stroke-width="7" stroke-linejoin="round"/>
    <path transform="translate(250 152) scale(.85) translate(-250 -152)" d="M275 150 C278 132 270 116 258 111 C246 111 234 126 228 140 Z" fill="#ffe9bf" stroke="#ffe9bf" stroke-width="6" stroke-linejoin="round"/>
    <!-- head: wide at the brow, narrowing to a pointed snout -->
    <path d="M108 172 C104 118 296 118 292 172 C290 214 246 250 200 262 C154 250 110 214 108 172 Z" fill="#9a5a2e"/>
    <path d="M200 262 C170 256 150 236 150 218 C168 208 232 208 250 218 C250 236 230 256 200 262 Z" fill="#ffd98a"/>
    <!-- face -->
    <ellipse cx="156" cy="176" rx="13" ry="16" fill="#2b1b17"/><circle cx="161" cy="170" r="5" fill="#fff"/>
    <ellipse cx="244" cy="176" rx="13" ry="16" fill="#2b1b17"/><circle cx="249" cy="170" r="5" fill="#fff"/>
    <circle cx="140" cy="212" r="11" fill="#ff8fa3" opacity=".5"/><circle cx="260" cy="212" r="11" fill="#ff8fa3" opacity=".5"/>
    <path d="M186 216 Q200 208 214 216 Q214 228 200 232 Q186 228 186 216 Z" fill="#2b1b17"/>
    <path d="M200 232v6M200 238q-11 10 -23 1M200 238q11 10 23 1" fill="none" stroke="#2b1b17" stroke-width="3.5"/>
    <path d="M150 226l-34-6M150 234l-32 6M250 226l34-6M250 234l32 6" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" fill="none"/>
    <!-- one arm reaches behind the page; its paw grips the bottom edge -->
    <path d="M244 304 C262 318 270 332 282 338" fill="none" stroke="#4a2c1a" stroke-width="22"/>
    <!-- page with the mark -->
    <g transform="rotate(8 279 296)">
      <rect x="244" y="252" width="70" height="88" rx="9" fill="#fff"/>
      <path d="M256 316V282l13 17 13-17v34" fill="none" stroke="url(#mark)" stroke-width="7"/>
      <path d="M301 282v30m-9-9 9 9 9-9" fill="none" stroke="url(#mark)" stroke-width="7"/>
    </g>
    <!-- the back of this paw faces us: just the claws -->
    <circle cx="283" cy="338" r="15" fill="#4a2c1a"/>
    <g fill="none" stroke-linecap="round"><path d="M276.9 325.4L275.5 322.5 M281.5 324.1L281.2 320.9 M286.4 324.4L287.2 321.3 M290.8 326.4L292.6 323.7" stroke="#8a6a3d" stroke-width="3.1"/><path d="M276.9 325.4L275.5 322.5 M281.5 324.1L281.2 320.9 M286.4 324.4L287.2 321.3 M290.8 326.4L292.6 323.7" stroke="#dcc08c" stroke-width="1.9"/></g>

  </g>
</svg>
